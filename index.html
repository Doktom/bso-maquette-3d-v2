<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Résidence Henri Clérisse – 3D</title>
<style>
  :root{--panel:rgba(255,255,255,.78);--ink:#1d2430;--mute:#5d6878;--line:rgba(30,40,55,.12);--acc:#1f6feb}
  @media (prefers-color-scheme:dark){:root{--panel:rgba(22,27,34,.72);--ink:#e8ecf2;--mute:#9aa5b4;--line:rgba(255,255,255,.1);--acc:#5aa2ff}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f3f4f5;color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;top:14px;left:14px;z-index:10;width:230px;padding:14px 16px;border-radius:16px;background:var(--panel);
      backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 8px 30px rgba(10,20,40,.18)}
  #ui b{display:block;font-size:15px}
  #ui .sub{color:var(--mute);font-size:12px;margin-bottom:10px}
  .tg{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
  .tg input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:10px;background:rgba(120,130,145,.35);position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
  .tg input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
  .tg input:checked{background:var(--acc)}
  .tg input:checked::after{left:16px}
  button{width:100%;margin-top:8px;font:inherit;color:var(--ink);background:rgba(120,130,145,.14);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  .street{position:fixed;left:0;top:0;z-index:5;pointer-events:none;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3f4652;
          background:rgba(255,255,255,.86);padding:2px 8px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.2)}
  .dest{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 11px 6px 7px;border-radius:12px;background:rgba(255,255,255,.94);
        box-shadow:0 4px 16px rgba(10,20,40,.22);white-space:nowrap;color:#1d2430}
  .dest i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:15px}
  .dest b{display:block;font-size:12.5px}
  .dest span{display:block;font-size:11px;color:#5d6878}
  .dest em{display:block;font-style:normal}
  #hint{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-size:12px;color:#fff;
        background:rgba(15,20,28,.45);backdrop-filter:blur(6px);padding:4px 12px;border-radius:20px;white-space:nowrap;transition:opacity .6s}
  #credit{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;font-size:10.5px;color:rgba(20,25,35,.6)}
  #load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#f3f4f5;color:#4a5566;transition:opacity .5s}
  #load div{width:200px;text-align:center}
  #load i{display:block;height:3px;margin-top:10px;border-radius:2px;background:linear-gradient(90deg,#1f6feb var(--p,0%),rgba(0,0,0,.08) 0)}
  /* visite guidée */
  #tour{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;align-items:center;gap:8px}
  #tourBtn,#tourBar{display:flex;align-items:center;gap:8px;width:auto;margin:0;padding:9px 18px;border-radius:24px;background:var(--panel);color:var(--ink);font-weight:600;
       backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:0 8px 30px rgba(10,20,40,.2);white-space:nowrap}
  #tourBtn svg{width:16px;height:16px;fill:currentColor}
  #tourMenu{display:none;width:300px;max-width:calc(100vw - 20px);padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
       backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 10px 34px rgba(10,20,40,.25)}
  #tour.open #tourMenu{display:block}
  #tourMenu .v{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 4px;padding:5px;text-align:left;border-radius:10px;background:transparent;border:1px solid transparent}
  #tourMenu .v:hover{background:rgba(120,130,145,.12);border-color:var(--line);color:var(--ink)}
  #tourMenu .v img{width:76px;height:43px;object-fit:cover;border-radius:6px;flex:none}
  #tourMenu .v b{display:block;font-size:13px} #tourMenu .v span{display:block;font-size:11px;color:var(--mute)}
  #tourMenu .go{margin:4px 0 0;padding:8px;font-weight:600;background:var(--acc);border-color:var(--acc);color:#fff}
  #tourMenu .go:hover{color:#fff;filter:brightness(1.1)}
  #tourBar{display:none;font-weight:500;padding:6px 6px 6px 16px}
  #tourBar button{width:auto;margin:0;padding:4px 12px;border-radius:16px}
  #tour.on #tourBtn,#tour.on #tourMenu{display:none} #tour.on #tourBar{display:flex}
  #shot{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity 1.2s ease;width:100%;height:100%;object-fit:cover}
  body.touring #hint{opacity:0}
  @media (max-width:640px){#ui{left:8px;right:8px;top:8px;width:auto;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-items:center}
    #ui>div:first-child{grid-column:1/-1} #ui .sub{display:none} #ui .tg{border:0;padding:0;gap:6px;font-size:12px} #ui button{grid-column:1/-1;margin-top:2px}
    #hint{display:none} #credit{left:8px;right:8px;text-align:center;font-size:9.5px;bottom:calc(62px + env(safe-area-inset-bottom))} .dest{padding:4px 8px 4px 5px} .dest i{width:20px;height:20px;font-size:12px} .dest b{font-size:11px} .dest span{font-size:10px} .dest em{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div><b>Résidence Henri Clérisse</b><div class="sub">Bretteville-sur-Odon · 30 logements</div></div>
  <label class="tg">Végétation <input type="checkbox" id="veg" checked></label>
  <label class="tg">Noms de rues <input type="checkbox" id="streets" checked></label>
  <label class="tg">Destinations <input type="checkbox" id="dests"></label>
  <button id="home">Recentrer la vue</button>
</div>
<div id="hint">Glisser pour tourner · molette ou pincer pour zoomer · clic droit ou deux doigts pour déplacer</div>
<img id="shot" alt="">
<div id="tour">
  <div id="tourMenu"></div>
  <button id="tourBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Visite guidée</button>
  <div id="tourBar"><span id="tourLbl"></span><button id="tourStop">Quitter</button></div>
</div>
<div id="credit">Bâtiments mitoyens : IFC du projet · Environnement © contributeurs OpenStreetMap · Itinéraires OSRM</div>
<div id="load"><div>Chargement de la maquette…<i id="bar"></i></div></div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';

const $ = (id) => document.getElementById(id);
const mobile = matchMedia('(max-width:640px), (pointer:coarse)').matches;

/* ---------- rendu ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;           // scène statique : l'ombre n'est calculée qu'au besoin
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minDistance: 10, maxDistance: 260, maxPolarAngle: Math.PI * 0.47 });
let dirty = 3, shadowDirty = true;

/* ---------- ciel, brume blanche, lumière (soleil fixe : fin d'après-midi d'été, à l'ouest-sud-ouest) ---------- */
const SUN_AZ = 248, SUN_EL = 30;                 // degrés ; azimut depuis le nord (-Z), vers l'est (+X)
const az = THREE.MathUtils.degToRad(SUN_AZ), el = THREE.MathUtils.degToRad(SUN_EL);
const sunDir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
const HORIZON = new THREE.Color(0xf3f4f5), ZENITH = new THREE.Color(0xa9c3e0);
scene.fog = new THREE.Fog(HORIZON, 160, 700);    // l'environnement se fond dans le blanc, comme en V1
const dome = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { hor: { value: HORIZON }, top: { value: ZENITH }, sun: { value: sunDir } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 hor, top, sun; varying vec3 vD;
    void main(){ vec3 d = normalize(vD); vec3 c = mix(hor, top, pow(clamp(d.y, 0.0, 1.0), 0.6));
      float s = max(dot(d, sun), 0.0); c += vec3(1.0, 0.92, 0.8) * (pow(s, 600.0) * 1.5 + pow(s, 14.0) * 0.08);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
dome.renderOrder = -30; dome.frustumCulled = false; scene.add(dome);
{ // reflets et lumière d'ambiance : ciel physique réduit, calculé une fois
  const env = new THREE.Scene(), sky = new Sky(); sky.scale.setScalar(50); env.add(sky);
  sky.material.uniforms.sunPosition.value.copy(sunDir);
  sky.material.uniforms.turbidity.value = 3; sky.material.uniforms.rayleigh.value = 1.6;
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0, 0.1, 200, { size: 128 }).texture;
  scene.environmentIntensity = 0.35;
}
scene.add(new THREE.HemisphereLight(0xeef2f8, 0xbdb8ae, 0.6));
const sun = new THREE.DirectionalLight(0xffe2bf, 2.5);   // modéré : le blanc ne sature pas, la voirie reste lisible
sun.castShadow = true;
sun.shadow.mapSize.setScalar(mobile ? 2048 : 4096);
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04; sun.shadow.radius = 2.5;
scene.add(sun, sun.target);

/* ---------- matériaux du bâtiment (légende des façades du permis), sobres façon maquette ---------- */
function canvasTex(draw, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.NoColorSpace; return t;
}
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const speckle = (g, s, amp, px) => { for (let y = 0; y < s; y += px) for (let x = 0; x < s; x += px) { const v = 255 - rnd() * amp; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, px, px); } };
const lines = (n, amp, na) => canvasTex((g, s) => { speckle(g, s, na, 2); g.fillStyle = `rgba(0,0,0,${amp})`; for (let p = 0; p < s; p += s / n) g.fillRect(p, 0, 2, s); });
const grid = (n, amp) => canvasTex((g, s) => { speckle(g, s, 14, 2); g.fillStyle = `rgba(0,0,0,${amp})`; for (let p = 0; p < s; p += s / n) { g.fillRect(p, 0, 2, s); g.fillRect(0, p, s, 2); } });
const blocks = (amp) => canvasTex((g, s) => {
  speckle(g, s, 30, 2); const h = s / 4;
  for (let r = 0; r < 4; r++) { g.fillStyle = `rgba(0,0,0,${amp})`; g.fillRect(0, r * h, s, 3);
    for (let x = (r % 2) * 40; x < s; x += 80) { g.fillStyle = `rgba(0,0,0,${amp})`; g.fillRect(x, r * h, 3, h); g.fillStyle = `rgba(0,0,0,${rnd() * 0.12})`; g.fillRect(x + 3, r * h + 3, 77, h - 3); } }
});
const LIB = {   // couleur, rugosité, métal, texture, taille du motif (m)
  enduit_clair: { c: 0xece4d2, r: 0.95, m: 0 },
  enduit_gris:  { c: 0xa9abae, r: 0.95, m: 0 },
  beton:        { c: 0xc4c3bf, r: 0.9,  m: 0 },
  platre:       { c: 0xf3f2ee, r: 0.95, m: 0 },
  pierre:       { c: 0xc2b69f, r: 0.95, m: 0, t: () => blocks(0.2), s: 1.6 },
  asphalte:     { c: 0xb7bbc0, r: 0.95, m: 0 },
  terre:        { c: 0xa9c094, r: 1,    m: 0 },
  dalle:        { c: 0xd3cfc7, r: 0.9,  m: 0, t: () => grid(2, 0.14), s: 1.2 },
  zinc:         { c: 0x8e969d, r: 0.45, m: 0.2, t: () => lines(2, 0.25, 0), s: 1.0 },
  gravier:      { c: 0xc9c7c2, r: 1,    m: 0 },
  menuiserie:   { c: 0x5c6167, r: 0.5,  m: 0.15 },
  bois:         { c: 0xa8794d, r: 0.7,  m: 0, t: () => lines(10, 0.12, 40), s: 0.8 },
  metal:        { c: 0x666b71, r: 0.5,  m: 0.5 },
  divers:       { c: 0xa9a9a9, r: 0.9,  m: 0 },
  verre:        { c: 0x6f93a8, r: 0.03, m: 0 },
};
const mats = new Map();
const rampMat = new THREE.MeshStandardMaterial({ color: 0x6e737a, roughness: 0.9, flatShading: true });
function makeMat(name) {
  if (mats.has(name)) return mats.get(name);
  const top = name.endsWith('@top');                // toiture : dessinée devant les murs/dalles de l'attique qui affleurent son plan
  const d = LIB[name.replace('@top', '')] ?? LIB.divers;
  const mat = new THREE.MeshStandardMaterial({ color: d.c, roughness: d.r, metalness: d.m, flatShading: true });
  mat.envMapIntensity = name === 'verre' ? 2.2 : d.m > 0.1 ? 0.9 : 0.5;
  if (name === 'verre') Object.assign(mat, { transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide });
  else Object.assign(mat, { polygonOffset: true, polygonOffsetFactor: top ? -1 : 1, polygonOffsetUnits: top ? -6 : 1 });
  if (d.t) {
    const tex = d.t();
    mat.onBeforeCompile = (sh) => {   // texture « triplanaire » en coordonnées monde (le modèle n'a pas d'UV)
      sh.uniforms.uTex = { value: tex }; sh.uniforms.uSize = { value: d.s };
      sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; uniform sampler2D uTex; uniform float uSize;')
        .replace('#include <map_fragment>', `vec3 wn = abs(normalize(cross(dFdx(vWP), dFdy(vWP))));
          vec2 tuv = (wn.y > wn.x && wn.y > wn.z) ? vWP.xz : (wn.x > wn.z ? vWP.zy : vWP.xy);
          diffuseColor.rgb *= texture2D(uTex, tuv / uSize).rgb;`);
    };
    mat.customProgramCacheKey = () => 'tri_' + name;
  }
  mats.set(name, mat); return mat;
}

/* ---------- chargement ---------- */
const manager = new THREE.LoadingManager();
manager.onProgress = (_, a, b) => $('bar').style.setProperty('--p', Math.round((a / b) * 100) + '%');
const gltf = new GLTFLoader(manager).setMeshoptDecoder(MeshoptDecoder);
const V = '?v=2.5';                           // version des données : évite de mélanger avec un ancien fichier en cache
const [bat, world, env] = await Promise.all([
  gltf.loadAsync('bso.glb' + V), gltf.loadAsync('world.glb' + V), fetch('env.json' + V).then((r) => r.json()),
]).catch((e) => { $('load').textContent = 'Erreur de chargement : ' + e.message; throw e; });
const GY = env.GY;

bat.scene.traverse((o) => {
  if (!o.isMesh) return;
  const name = o.userData.name || o.name, cat = name.split('|')[1];
  if (cat === 'plafond') { o.visible = false; return; }            // faux plafonds : invisibles de l'extérieur
  const glass = o.material.name === 'verre';
  o.material = name === 'SOUS SOL|escalier' ? rampMat : makeMat(o.material.name + (name === 'TOITURE|toit' ? '@top' : ''));   // rampe du parking souterrain : enrobé sombre
  o.castShadow = !glass; o.receiveShadow = true;
});
scene.add(bat.scene);
{ // murs / dalles de l'attique qui percent la toiture de quelques cm (défaut de la maquette IFC) : sommets ramenés juste sous le toit
  bat.scene.updateMatrixWorld(true);
  const roof = bat.scene.getObjectByName('TOITURE|toit'), rc = new THREE.Raycaster(), p = new THREE.Vector3(), inv = new THREE.Matrix4();
  rc.ray.direction.set(0, -1, 0);
  bat.scene.traverse((o) => {
    if (!o.isMesh || o === roof || !/^(R\+2|R\+3|HORS-NIVEAU)\|(mur|dalle|divers|structure)/.test(o.name)) return;
    const pos = o.geometry.attributes.position; inv.copy(o.matrixWorld).invert(); let n = 0;
    for (let i = 0; i < pos.count; i++) {
      p.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (p.y < 13 || p.y > 17.5) continue;
      rc.ray.origin.set(p.x, 30, p.z); const h = rc.intersectObject(roof, false)[0];
      if (!h || p.y < h.point.y - 0.02 || p.y > h.point.y + 0.25) continue;   // pignons, lucarnes : bien au-dessus du toit, inchangés
      p.y = h.point.y - 0.04; p.applyMatrix4(inv); pos.setXYZ(i, p.x, p.y, p.z); n++;
    }
    if (n) { pos.needsUpdate = true; o.geometry.computeBoundingSphere(); }
  });
}

/* ---------- environnement plat « clay » : sol blanc, voirie en couches à ordre de dessin fixe (aucun scintillement) ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(2500, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xf6f6f3, roughness: 1 }));
ground.position.y = GY; ground.receiveShadow = true; ground.renderOrder = -20; scene.add(ground);
const clayMat = new THREE.MeshStandardMaterial({ color: 0xf8f7f4, roughness: 0.95, envMapIntensity: 0.35, side: THREE.DoubleSide });
const flat = (color, order) => new THREE.MeshStandardMaterial({ color, roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1 - order, polygonOffsetUnits: -1 - order });
const LAYERS = { parking: [0xc9ccd0, 1], chaussee: [0xa7acb3, 2], trottoir: [0xdcd9d3, 3], passages: [0xffffff, 4],
                 route_caen: [0, 5], route_a84: [0, 5] };
const routes = new THREE.Group(); routes.visible = false; scene.add(routes);
world.scene.traverse((o) => {
  if (!o.isMesh) return;
  o.geometry.computeVertexNormals();
  if (o.name === 'bati' || o.name === 'mitoyens') {
    o.geometry = o.geometry.toNonIndexed(); o.geometry.computeVertexNormals();
    o.material = clayMat; o.castShadow = o.receiveShadow = true; return;
  }
  const L = LAYERS[o.name]; if (!L) return;
  const isRoute = o.name.startsWith('route_');
  const col = isRoute ? (env.dests ?? []).find((d) => 'route_' + d.key === o.name)?.color ?? 0x1f6feb : L[0];
  o.material = isRoute ? new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.75, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -8, polygonOffsetUnits: -8 }) : flat(col, L[1]);
  o.renderOrder = -10 + L[1]; o.receiveShadow = !isRoute;
});
world.scene.position.y = GY + 0.02; world.scene.updateMatrixWorld(true);
scene.add(world.scene);
for (const n of ['route_caen', 'route_a84']) { const m = world.scene.getObjectByName(n); if (m) routes.attach(m); }

/* ---------- cadrage ---------- */
const box = new THREE.Box3().setFromObject(bat.scene), ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const R = Math.max(size.x, size.z);
const HOME = { off: new THREE.Vector3(-R * 0.35, R * 0.75, -R * 1.45), tgt: ctr.clone().setY(ctr.y - 4) };   // depuis le nord : l'angle des deux rues
const homePos = () => ctr.clone().add(HOME.off.clone().multiplyScalar(innerWidth / innerHeight < 0.8 ? 1.7 : 1));   // écran vertical : on recule
camera.position.copy(homePos()); controls.target.copy(HOME.tgt);
sun.position.copy(ctr).addScaledVector(sunDir, 250); sun.target.position.copy(ctr); sun.target.updateMatrixWorld();
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 50, far: 500 }); sun.shadow.camera.updateProjectionMatrix();

/* ---------- végétation : arbres low-poly fusionnés (prévus au plan masse + arbres existants OSM) ---------- */
const vegetation = new THREE.Group(); scene.add(vegetation);
{
  const down = new THREE.Raycaster(); down.ray.direction.set(0, -1, 0);
  const terre = []; bat.scene.traverse((o) => o.isMesh && o.material === mats.get('terre') && terre.push(o));
  const crown = new THREE.IcosahedronGeometry(1, 1), trunk = new THREE.CylinderGeometry(0.16, 0.26, 1, 6).toNonIndexed();
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), P = new THREE.Vector3(), Sc = new THREE.Vector3();
  const C = [], T = [];
  const add = (t, i) => {
    const r = t.R, th = t.th, rot = (i * 2.399) % 6.283;
    const put = (g, arr, px, py, pz, sx, sy, sz) => { E.set(0, rot, 0); Q.setFromEuler(E); M.compose(P.set(t.x + px, t.y + py, t.z + pz), Q, Sc.set(sx, sy, sz)); arr.push(g.clone().applyMatrix4(M)); };
    put(trunk, T, 0, th / 2, 0, 1, th, 1);
    put(crown, C, 0, th + r * 0.85, 0, r, r * 1.08, r);
    put(crown, C, r * 0.3, th + r * 1.7, r * 0.12, r * 0.6, r * 0.6, r * 0.6);
    put(crown, C, -r * 0.55, th + r * 0.55, r * 0.3, r * 0.52, r * 0.48, r * 0.52);
  };
  env.planned.forEach((t, i) => {   // arbres du projet, posés sur la terre du jardin
    down.ray.origin.set(t.x, box.max.y + 5, t.z); const h = down.intersectObjects(terre, false)[0];
    add({ x: t.x, z: t.z, y: h ? h.point.y : GY, R: t.r * 0.95, th: 2.8 }, i);
  });
  env.trees.forEach((t, i) => add({ x: t.x, z: t.z, y: GY, R: 2.0 + (i % 5) * 0.35, th: 2.3 }, i + 10));
  const mk = (geos, color) => { const m = new THREE.Mesh(mergeGeometries(geos), new THREE.MeshStandardMaterial({ color, roughness: 0.9, flatShading: true })); m.castShadow = m.receiveShadow = true; vegetation.add(m); };
  mk(T, 0x8a7a66); mk(C, 0x8fb470);
}
$('veg').onchange = (e) => { vegetation.visible = e.target.checked && vegA > 0.01; shadowDirty = true; dirty = 2; };

/* ---------- étiquettes : noms de rues + destinations (couche d'infos) ---------- */
const labels = env.labels.map((l) => {
  const el = document.createElement('div'); el.className = 'street'; el.textContent = l.text; document.body.append(el);
  return { el, pos: new THREE.Vector3(l.x, GY + 0.6, l.z), kind: 'street' };
});
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
for (const d of env.dests ?? []) {
  const el = document.createElement('div'); el.className = 'dest';
  el.innerHTML = `<i style="background:${hex(d.color)}">➜</i><div><b>${d.name}</b><span>${d.sub ? '<em>' + d.sub + '</em>' : ''}${String(d.km).replace('.', ',')} km · ${d.min} min en voiture</span></div>`;
  document.body.append(el);
  labels.push({ el, pos: new THREE.Vector3(d.x, GY + 1.5, d.z), dir: new THREE.Vector3(d.dir[0], 0, d.dir[1]).normalize(), arrow: el.querySelector('i'), kind: 'dest' });
}
const v3 = new THREE.Vector3(), v4 = new THREE.Vector3(), occl = new THREE.Raycaster(), blockers = [bat.scene, world.scene.getObjectByName('bati'), world.scene.getObjectByName('mitoyens')].filter(Boolean);
let lastOccl = 0;
function updateOcclusion() {     // un nom de rue caché derrière un volume n'est pas affiché (vérifié au plus toutes les 250 ms)
  if (performance.now() - lastOccl < 250) return; lastOccl = performance.now();
  for (const l of labels) {
    if (l.kind !== 'street') continue;
    const d = camera.position.distanceTo(l.pos); occl.set(camera.position, v3.copy(l.pos).sub(camera.position).normalize()); occl.far = d - 1;
    l.hidden = occl.intersectObjects(blockers, true).length > 0;
  }
  dirty = Math.max(dirty, 1);
}
function placeLabels() {
  const placed = [];
  const showS = $('streets').checked, showD = $('dests').checked;
  for (const l of labels) {
    const on = l.kind === 'street' ? showS && !l.hidden && camera.position.distanceTo(l.pos) < 260 : showD;
    v3.copy(l.pos).project(camera);
    let vis = on && v3.z < 1 && Math.abs(v3.x) < 1.15 && Math.abs(v3.y) < 1.15;
    if (on && l.kind === 'dest' && !vis) {           // destination hors champ : l'étiquette reste épinglée au bord de l'écran, dans sa direction
      if (v3.z > 1) { v3.x = -v3.x; v3.y = -v3.y; }
      const k = Math.max(Math.abs(v3.x) / 0.82, Math.abs(v3.y) / 0.8, 1); v3.x /= k; v3.y /= k; vis = true;
    }
    l.el.style.display = vis ? '' : 'none';
    if (!vis) continue;
    let sx = (v3.x * 0.5 + 0.5) * innerWidth, sy = (-v3.y * 0.5 + 0.5) * innerHeight;
    if (l.kind === 'dest') {                          // l'étiquette entière reste dans l'écran
      const hw = l.el.offsetWidth / 2 + 8, hh = l.el.offsetHeight / 2 + 8;
      sx = Math.min(Math.max(sx, hw), innerWidth - hw); sy = Math.min(Math.max(sy, hh + 60), innerHeight - hh - 24);
      for (let n = 0; n < 4; n++) {                   // pas de chevauchement entre étiquettes de destination
        const hit = placed.find((p) => Math.abs(p[0] - sx) < p[2] + hw && Math.abs(p[1] - sy) < p[3] + hh);
        if (!hit) break; sy = hit[1] + (sy >= hit[1] ? 1 : -1) * (hit[3] + hh);
      }
      placed.push([sx, sy, hw, hh]);
    }
    l.el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%)`;
    if (l.arrow) {   // flèche orientée dans le sens de la route, vue depuis la caméra
      v4.copy(l.pos).add(l.dir).project(camera);
      l.arrow.style.transform = `rotate(${Math.atan2(-(v4.y - v3.y), (v4.x - v3.x) * camera.aspect)}rad)`;
    }
  }
}
$('streets').onchange = () => (dirty = 2);
$('dests').onchange = (e) => { routes.visible = e.target.checked; dirty = 2; };

/* ---------- caméra : jamais sous le sol, cible gardée près du site ---------- */
function keepInBounds() {
  const t = controls.target; const d = Math.hypot(t.x - ctr.x, t.z - ctr.z);
  if (d > 160) { t.x = ctr.x + ((t.x - ctr.x) * 160) / d; t.z = ctr.z + ((t.z - ctr.z) * 160) / d; }
  if (camera.position.y < GY + 1.7) camera.position.y = GY + 1.7;
}
$('home').onclick = () => { stopTour(); camera.position.copy(homePos()); controls.target.copy(HOME.tgt); dirty = 2; };

/* ---------- visite guidée : vols de caméra vers les 3 points de vue du projet + fondu vers les images fournies ----------
   Caméras retrouvées par recalage (points de fuite, fenêtres de toit, angles de toiture) : perspective 2 points
   (caméra horizontale, verticales droites) avec décentrement — pp = point principal dans l'image 2000×1129. */
const IMG_W = 2000, IMG_H = 1129;
const SHOTS = [
  { name: 'Cœur d\'îlot', sub: 'Vue depuis la cour et la rampe du parking', img: 'vues/vue-1.jpg', pos: [-1.48, 13.087, 40.465], yaw: 3.06256, f: 1659.9, pp: [905.6, 622.5] },     // ≈ 30 mm
  { name: 'Angle des rues', sub: 'Route de Bretagne × rue du Viquet', img: 'vues/vue-2.jpg', pos: [3.45, 10.481, -45.876], yaw: -0.31073, f: 1179.4, pp: [1024, 560.9] },          // ≈ 21 mm
  { name: 'Route de Bretagne', sub: 'Façade sur rue, à hauteur de piéton', img: 'vues/vue-3.jpg', pos: [-23.619, 6.803, -43.669], yaw: 6.67277, f: 1147.6, pp: [1055.9, 622.1] }, // ≈ 21 mm
];
const shotEl = $('shot'), tourEl = $('tour');
const off = { x: 0, y: 0 };                       // décentrement courant (px écran)
function frameOf(s) {   // fov + décentrement pour que la 3D se superpose exactement à l'image affichée (cover en paysage, contain en portrait)
  const sw = innerWidth, sh = innerHeight, cover = sw / sh >= 1;
  const k = cover ? Math.max(sw / IMG_W, sh / IMG_H) : Math.min(sw / IMG_W, sh / IMG_H);
  return { fov: THREE.MathUtils.radToDeg(2 * Math.atan(sh / 2 / (s.f * k))), ox: (s.pp[0] - IMG_W / 2) * k, oy: (s.pp[1] - IMG_H / 2) * k, cover };
}
function applyOffset() {
  if (Math.abs(off.x) < 0.01 && Math.abs(off.y) < 0.01) camera.clearViewOffset();
  else camera.setViewOffset(innerWidth, innerHeight, -off.x, -off.y, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}
let vegA = 1;
function vegFade(a) {   // arbres en fondu : les images du projet n'en montrent pas
  vegA = a; vegetation.traverse((o) => { if (o.isMesh) { if (o.material.transparent !== a < 1) { o.material.transparent = a < 1; o.material.depthWrite = a >= 1; o.material.needsUpdate = true; } o.material.opacity = a; o.castShadow = a > 0.99; } });
  vegetation.visible = $('veg').checked && a > 0.01; shadowDirty = true;
}
const tmpCam = new THREE.PerspectiveCamera(), ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
let tour = null;
function anim(dur, fn) {   // animation annulable (la visite s'arrête dès que l'utilisateur reprend la main)
  const tk = tour;
  return new Promise((res, rej) => {
    const t0 = performance.now();
    const step = (now) => {
      if (tour !== tk) return rej('stop');
      const t = Math.min((now - t0) / dur, 1); fn(t); dirty = 2;
      t < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
const wait = (ms) => anim(ms, () => {});
function fly(p1, look1, fov1, ox1, oy1, fadeVeg = true) {        // trajectoire en arc autour du bâtiment, regard guidé vers le projet à mi-parcours
  const p0 = camera.position.clone(), fov0 = camera.fov, ox0 = off.x, oy0 = off.y;
  const look0 = p0.clone().add(camera.getWorldDirection(v3).multiplyScalar(30));
  const c = new THREE.Vector3(ctr.x, 0, ctr.z), a0 = Math.atan2(p0.x - c.x, p0.z - c.z), a1 = Math.atan2(p1.x - c.x, p1.z - c.z);
  let da = a1 - a0; da = Math.atan2(Math.sin(da), Math.cos(da));
  const r0 = Math.hypot(p0.x - c.x, p0.z - c.z), r1 = Math.hypot(p1.x - c.x, p1.z - c.z);
  const d = p0.distanceTo(p1), bump = Math.min(d * 0.25, 30) * (Math.abs(da) > 0.6 ? 1 : 0.4), rMin = 48;
  const mid = new THREE.Vector3(ctr.x, 9, ctr.z);
  const va = vegA, vb = fadeVeg ? 0 : 1;
  return anim(THREE.MathUtils.clamp(2400 + d * 38, 3000, 7500), (t) => {
    const vt = THREE.MathUtils.clamp((t - (vb ? 0 : 0.6)) / 0.4, 0, 1); if (va !== vb) vegFade(THREE.MathUtils.lerp(va, vb, vt));
    const e = ease(t), a = a0 + da * e, s = Math.sin(Math.PI * e);
    const r = THREE.MathUtils.lerp(r0, r1, e), rr = Math.max(r, THREE.MathUtils.lerp(r, rMin, s));   // on reste hors des volumes pendant le vol
    camera.position.set(c.x + Math.sin(a) * rr, THREE.MathUtils.lerp(p0.y, p1.y, e) + bump * s, c.z + Math.cos(a) * rr);
    const w = 2 * e * (1 - e);                                                                          // cible : Bézier départ → projet → arrivée
    tmpCam.position.copy(camera.position);
    tmpCam.lookAt(v4.copy(look0).multiplyScalar((1 - e) ** 2).addScaledVector(mid, w).addScaledVector(look1, e * e));
    camera.quaternion.copy(tmpCam.quaternion);
    camera.fov = THREE.MathUtils.lerp(fov0, fov1, e); off.x = THREE.MathUtils.lerp(ox0, ox1, e); off.y = THREE.MathUtils.lerp(oy0, oy1, e); applyOffset();
  });
}
async function showShot(s) {
  const fr = frameOf(s), p1 = new THREE.Vector3(...s.pos), look1 = p1.clone().add(new THREE.Vector3(Math.sin(s.yaw), 0, Math.cos(s.yaw)).multiplyScalar(30));
  shotEl.style.objectFit = fr.cover ? 'cover' : 'contain'; shotEl.src = s.img;
  await fly(p1, look1, fr.fov, fr.ox, fr.oy);
  await wait(700);
  shotEl.style.opacity = 1; await wait(1300 + 4000);      // fondu 3D → image, puis arrêt sur l'image
  shotEl.style.opacity = 0; await wait(1300 + 500);       // fondu retour vers la 3D
}
function release(keepTarget) {    // rend la main : l'orbite reprend autour d'un point devant la caméra
  const fov0 = camera.fov, ox0 = off.x, oy0 = off.y, t0 = performance.now();
  if (!keepTarget) controls.target.copy(camera.position).add(camera.getWorldDirection(v3).multiplyScalar(Math.max(15, camera.position.distanceTo(ctr) * 0.8)));
  const step = (now) => {       // retour en douceur à l'objectif standard (40°, sans décentrement)
    if (tour) return;
    const e = ease(Math.min((now - t0) / 700, 1));
    camera.fov = THREE.MathUtils.lerp(fov0, 40, e); off.x = ox0 * (1 - e); off.y = oy0 * (1 - e); applyOffset(); dirty = 2;
    if (e < 1) requestAnimationFrame(step); else controls.enabled = true;
  };
  requestAnimationFrame(step);
}
async function runTour(list, goHome) {
  stopTour(); tour = {}; const tk = tour;
  tourEl.classList.remove('open'); tourEl.classList.add('on'); document.body.classList.add('touring'); controls.enabled = false;
  list.forEach((s) => (new Image().src = s.img));          // préchargement des images
  try {
    for (const s of list) { $('tourLbl').textContent = (list.length > 1 ? `Vue ${SHOTS.indexOf(s) + 1}/3 · ` : '') + s.name; await showShot(s); }
    if (goHome) { $('tourLbl').textContent = 'Retour à la vue d\'ensemble'; await fly(homePos(), HOME.tgt, 40, 0, 0, false); controls.target.copy(HOME.tgt); }
  } catch (e) { if (e !== 'stop') throw e; }
  if (tour === tk) { tour = null; endTour(goHome); }
}
function endTour(keepTarget) { if (vegA < 1) vegFade(1); tourEl.classList.remove('on'); document.body.classList.remove('touring'); shotEl.style.opacity = 0; release(keepTarget); }
function stopTour() { if (!tour) return; tour = null; endTour(); }
$('tourMenu').innerHTML = SHOTS.map((s, i) => `<button class="v" data-i="${i}"><img src="${s.img.replace('.jpg', '-mini.jpg')}" alt=""><div><b>${i + 1} · ${s.name}</b><span>${s.sub}</span></div></button>`).join('')
  + '<button class="go">▶ Lancer la visite</button>';
$('tourBtn').onclick = (e) => { e.stopPropagation(); tourEl.classList.toggle('open'); $('hint').style.opacity = 0; };
$('tourMenu').onclick = (e) => {
  e.stopPropagation(); const b = e.target.closest('button'); if (!b) return;
  b.classList.contains('go') ? runTour(SHOTS, true) : runTour([SHOTS[+b.dataset.i]], false);
};
$('tourStop').onclick = stopTour;
addEventListener('pointerdown', (e) => { if (!tourEl.contains(e.target)) tourEl.classList.remove('open'); });
renderer.domElement.addEventListener('pointerdown', stopTour);
renderer.domElement.addEventListener('wheel', stopTour, { passive: true });
addEventListener('keydown', (e) => e.key === 'Escape' && stopTour());

/* ---------- boucle : rendu seulement si quelque chose bouge ---------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; applyOffset(); dirty = 2;
}
addEventListener('resize', resize); new ResizeObserver(resize).observe(document.documentElement); resize();
controls.addEventListener('start', () => ($('hint').style.opacity = 0));
renderer.setAnimationLoop(() => {
  const moving = tour ? false : controls.update();   // pendant la visite, la caméra est pilotée par l'animation
  if (!moving && dirty <= 0) return;
  dirty = Math.max(0, dirty - 1);
  if (!tour) keepInBounds();
  const dist = tour ? 25 : camera.position.distanceTo(controls.target), near = THREE.MathUtils.clamp(dist / 120, 0.2, 4);
  if (Math.abs(near - camera.near) > camera.near * 0.2) { camera.near = near; camera.updateProjectionMatrix(); }
  if (shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  dome.position.copy(camera.position);
  renderer.render(scene, camera); if ($('streets').checked) updateOcclusion(); placeLabels();
});
window.__v2 = { camera, controls, ctr, R, scene, redraw: () => (dirty = 3), setHome: (p, t) => { camera.position.set(...p); controls.target.set(...t); dirty = 3; } };   // réglage du cadrage (débogage)
$('load').style.opacity = 0; setTimeout(() => $('load').remove(), 500);
setTimeout(() => ($('hint').style.opacity = 0), 7000);
</script>
</body>
</html>
